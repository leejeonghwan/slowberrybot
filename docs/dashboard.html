<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>슬로우스크립트 대시보드</title>
<style>
:root{--ink:#14181C;--muted:#727A82;--line:rgba(20,24,28,.14);--navy:#1F3A63;--paper:#F4F5F2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;
  font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
input,button,select{font:inherit}
.add{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.add input[type=url]{flex:1;min-width:240px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;background:#fff}
.add button{padding:11px 18px;border:0;border-radius:9px;background:var(--navy);color:#fff;
  font-weight:700;cursor:pointer}
.add button:disabled{opacity:.5;cursor:default}
label.opt{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.msg{font-size:13px;margin:6px 0 18px;min-height:18px}
.msg.err{color:var(--navy)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.col h2{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.job{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.job .u{font-size:12.5px;word-break:break-all;color:var(--ink)}
.job .m{font-size:11px;color:var(--muted);margin-top:3px;font-family:ui-monospace,Menlo,monospace}
.job .x{float:right;border:0;background:0;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 6px}
.job .x:hover{color:var(--navy)}
.job.doing{border-color:var(--navy)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;
  background:rgba(31,58,99,.08);color:var(--navy);border:1px solid rgba(31,58,99,.25)}
.empty{color:var(--muted);font-size:12.5px}
/* 지금 도는 작업이 주인공. 나머지는 곁가지로 물러난다. */
.hero{background:#fff;border:1px solid var(--navy);border-radius:12px;padding:18px 20px;margin:0 0 14px}
.hero.idle{border-color:var(--line);color:var(--muted);font-size:13.5px;text-align:center;padding:26px}
.herotop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill.big{font-size:13.5px;padding:3px 12px}
.ago{font-size:12.5px;color:var(--muted)}
.hero .u{font-size:14.5px;word-break:break-all;margin-bottom:2px}
.hero .m{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.mini>b{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.mini .job{margin-bottom:6px}
.bad{color:var(--navy)}
details#hist{margin-top:6px}
details#hist summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.bar a,.gearbtn{color:var(--muted);font-size:12px;cursor:pointer;background:0;border:0}
.footer{margin-top:40px;color:var(--muted);font-size:12px}
a{color:var(--navy)}
/* 앱 로그인 게이트 */
.loginbox{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.loginbox h2{font-size:19px;font-weight:800;margin:0 0 4px}
.loginbox>p{color:var(--muted);font-size:13px;margin:0 0 16px}
.loginbox input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;margin:0 0 10px;background:#fff}
.loginbox button{width:100%;padding:11px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.lg_err{color:var(--navy);font-size:13px;margin-top:10px;min-height:18px}
</style></head>
<body><div class="wrap">

<div id="loginView" hidden>
  <div class="loginbox">
    <h2>슬로우스크립트 대시보드</h2>
    <p>로그인이 필요합니다.</p>
    <input id="lg_user" placeholder="아이디" autocomplete="username">
    <input id="lg_pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="lg_btn">로그인</button>
    <div class="lg_err" id="lg_err"></div>
  </div>
</div>

<div id="dash" hidden>
<h1>슬로우스크립트 대시보드.</h1>
<p class="sub">링크를 넣으면 파이 워커가 대본 → 기사까지 처리합니다. 진행 상황은 아래에서.</p>

<div id="app" hidden>
  <div class="add">
    <input id="url" type="url" placeholder="유튜브 링크 붙여넣기…">
    <label class="opt"><input type="checkbox" id="nofc"> 팩트체크 생략(빠르게)</label>
    <button id="go" onclick="submit()">큐에 넣기</button>
  </div>
  <div class="msg" id="dupchk"></div>
  <div class="msg" id="msg"></div>

  <div class="bar">
    <span style="font-size:13px;color:var(--muted)" id="updated">—</span>
    <button class="gearbtn" onclick="logout()">로그아웃</button>
  </div>
  <div id="now"></div>
  <div id="waitbox"></div>
  <details id="hist"><summary id="histsum">지난 작업</summary><div id="histbody"></div></details>
  <p class="footer">10초마다 자동 새로고침. 완료된 기사 링크는 텔레그램으로도 옵니다.</p>
</div>
</div>

<script>
const LS = localStorage, $ = id => document.getElementById(id);

// 서빙 경로(/factory 등) 주입. FastAPI가 서빙하면 아래 토큰이 실제 경로로 치환된다.
// 로컬 raw 파일(file://·http.server)로 열면 치환이 안 돼 그대로 남는다 → 앱 API가 없으니 안내만.
const RAW_BASE = "__BASE_PATH__";
const SERVED = !RAW_BASE.startsWith("__");
const BASE = SERVED ? RAW_BASE : "";
const AUTH_KEY = "slowscript_token";
const tok = () => LS.getItem(AUTH_KEY) || "";

// 발행된 회차(vid → 회차) — 링크 입력 시 중복 확인용. 아카이브 published.json을 앱이 프록시.
const ARCHIVE = "https://leejeonghwan.github.io/slowberrybot/";
let PUB = null;
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vidOf = u => { const m=(u||"").match(/(?:v=|youtu\.be\/|\/live\/|\/shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:""; };

// 앱 API 호출(깃허브 토큰은 서버에만; 브라우저는 앱 세션 토큰으로만 부른다).
async function api(path, opts={}){
  const r = await fetch(BASE+path, {...opts, headers:{
    "Authorization":"Bearer "+tok(), "Content-Type":"application/json", ...(opts.headers||{})}});
  if(r.status===401){ LS.removeItem(AUTH_KEY); showLogin(); throw new Error("세션 만료 — 다시 로그인하세요."); }
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail||""; }catch(e){} throw new Error(d||("HTTP "+r.status)); }
  return r.status===204 ? null : r.json();
}

// ── 로그인 게이트 ──
function showLogin(){ $("loginView").hidden=false; $("dash").hidden=true; }
function startDash(){ $("loginView").hidden=true; $("dash").hidden=false; $("app").hidden=false; loadPub(); refresh(); }
function logout(){ LS.removeItem(AUTH_KEY); showLogin(); }
async function doLogin(){
  $("lg_err").textContent="";
  const u=$("lg_user").value.trim(), p=$("lg_pw").value;
  if(!u||!p){ $("lg_err").textContent="아이디와 비밀번호를 입력하세요."; return; }
  try{
    const r=await fetch(BASE+"/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:u,password:p})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||("HTTP "+r.status));
    LS.setItem(AUTH_KEY, d.token); startDash();
  }catch(e){ $("lg_err").textContent="로그인 실패: "+e.message; }
}
$("lg_btn").addEventListener("click", doLogin);
$("lg_pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("url").addEventListener("input", checkDup);

// ── enqueue ──
function setMsg(t,err){ const m=$("msg"); m.textContent=t; m.className="msg"+(err?" err":""); }
async function loadPub(){ try{ const d=await api("/api/published"); PUB=(d&&d.vids)||{}; checkDup(); }catch(e){ PUB=PUB||{}; } }
function checkDup(){
  const el=$("dupchk"); if(!el) return;
  const v=vidOf($("url").value.trim());
  const p=(v&&PUB)?PUB[v]:null;
  if(p){ el.innerHTML='⚠️ 이미 발행됨 — '+esc(p.label)+(p.date?" ("+esc(p.date)+")":"")
           +' · <a href="'+ARCHIVE+esc(p.path)+'" target="_blank" rel="noopener">보기</a>'; el.className="msg err"; }
  else{ el.textContent=""; el.className="msg"; }
}
async function submit(){
  const url=$("url").value.trim();
  if(!/youtu\.?be|youtube\.com/.test(url)){ setMsg("유튜브 링크가 아닌 것 같아요.", true); return; }
  const v=vidOf(url), p=(v&&PUB)?PUB[v]:null;
  if(p && !confirm("이미 발행된 영상입니다 ("+p.label+(p.date?" "+p.date:"")+").\n그래도 큐에 넣을까요?")) return;
  $("go").disabled=true; setMsg("큐에 넣는 중…");
  try{
    await api("/api/queue/enqueue",{method:"POST",
      body:JSON.stringify({url, no_fact_check:$("nofc").checked})});
    $("url").value=""; checkDup(); setMsg("✅ 넣었습니다. 파이 워커가 곧 집습니다."); refresh();
  }catch(e){ setMsg("실패: "+e.message, true); }
  $("go").disabled=false;
}

// ── 렌더 ──
function jname(f){ return f.name.replace(/\.job$/,""); }
function jobCard(f, st, cls, del){
  const s=st[jname(f)]||{};
  const url=(s.url||"").replace(/^https?:\/\//,"");
  const stage=s.stage? `<span class="pill">${s.stage}</span> ` : "";
  const x=del? `<button class="x" title="큐에서 삭제" onclick="delJob('${jname(f)}')">✕</button>` : "";
  return `<div class="job ${cls||""}">${x}${stage}<div class="u">${url||jname(f)}</div>`+
         `<div class="m">${jname(f)}${s.updated? " · "+s.updated.slice(11,16):""}</div></div>`;
}
async function delJob(name){
  if(!confirm("이 작업을 큐에서 삭제할까요?")) return;
  try{ await api("/api/queue/dequeue",{method:"POST",body:JSON.stringify({name})});
    setMsg("삭제했습니다."); refresh();
  }catch(e){ setMsg("삭제 실패: "+e.message, true); }
}
function since(iso){
  if(!iso) return "";
  const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  return m<1? "방금" : (m<60? m+"분째" : Math.floor(m/60)+"시간 "+(m%60)+"분째");
}
async function refresh(){
  if($("dash").hidden) return;
  try{
    const q=await api("/api/queue");
    const st=q.status||{};

    const doing=q.processing||[];
    $("now").innerHTML = doing.length? doing.map(f=>{
      const s=st[jname(f)]||{};
      const url=(s.url||"").replace(/^https?:\/\//,"");
      return `<div class="hero"><div class="herotop">`+
        `<span class="pill big">${s.stage||"처리 중"}</span>`+
        `<span class="ago">${since(s.started||s.updated)}</span></div>`+
        `<div class="u">${url||jname(f)}</div>`+
        `<div class="m">${jname(f)}</div></div>`;
    }).join("") : '<div class="hero idle">지금 처리 중인 작업이 없습니다.</div>';

    const wait=q.incoming||[];
    $("waitbox").innerHTML = wait.length?
      `<div class="mini"><b>대기 ${wait.length}</b>`+
      wait.map(f=>jobCard(f,st,"",true)).join("")+`</div>` : "";

    const doneA=q.done||[], failA=q.failed||[];
    const d=doneA.slice(-5).reverse(), fl=failA.slice(-5).reverse();
    $("histsum").innerHTML = `지난 작업 — 완료 ${doneA.length}`
      + (fl.length? ` · <b class="bad">실패 ${failA.length}</b>` : "");
    $("hist").open = fl.length>0;
    $("histbody").innerHTML =
      (fl.length? '<div class="mini"><b class="bad">실패</b>'+fl.map(f=>jobCard(f,st,"",true)).join("")+'</div>' : "")
      + (d.length? '<div class="mini"><b>완료</b>'+d.map(f=>jobCard(f,st,"",false)).join("")+'</div>' : "");

    $("updated").textContent="갱신 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }catch(e){ setMsg("조회 실패: "+e.message, true); }
}

// ── 시작 ──
if(!SERVED){
  showLogin();
  $("lg_err").textContent="이 페이지는 앱으로 열어야 작동합니다(run_local.sh 또는 slownews.net/factory).";
}else if(tok()){ startDash(); }
else{ showLogin(); }
setInterval(()=>{ if(!$("dash").hidden && !$("app").hidden) refresh(); }, 10000);
</script>
</div></body></html>
