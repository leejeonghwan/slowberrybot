<head>

<title>국정감사 대시보드 — 슬로우뉴스.</title>
<style>
:root{--ink:#141414;--sub:#767676;--line:#e5e4e1;--bg:#faf9f7;--card:#fff;
 --red:#b93a2c;--redbg:#fbeeeb;--blue:#2b5d8b;--bluebg:#edf2f7;
 --gold:#8a6a1a;--goldbg:#f9f4e6;--gray:#5a5a5a;--graybg:#f0efec}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.7 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
 color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 90px}
header{padding:34px 0 18px;border-bottom:2px solid var(--ink)}
h1{font-size:25px;font-weight:800;letter-spacing:-.5px}
.sum{margin-top:9px;font-size:13px;color:var(--sub)}
nav{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{font:inherit;font-size:14px;font-weight:700;background:none;border:0;
 padding:11px 17px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.panel{display:none;padding-top:24px}.panel.on{display:block}
h2{font-size:17px;font-weight:800;margin:30px 0 12px;letter-spacing:-.3px}
h2:first-child{margin-top:0}
h2 small{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:7px}
.hm{background:var(--card);border:1px solid var(--line);padding:16px 18px;overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font-size:11px}
table.heat th{font-weight:600;color:var(--sub);font-size:10.5px;text-align:center;padding:0 1px}
table.heat th.cm{text-align:right;padding-right:8px;font-size:12px;color:var(--ink);font-weight:700;white-space:nowrap}
.cell{width:30px;height:28px;border-radius:2px;background:#f2f1ee;position:relative;border:1px solid transparent}
.cell.has{cursor:pointer;border-color:rgba(0,0,0,.08)}
.cell.has:hover{outline:2px solid var(--ink);outline-offset:1px}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:11.5px;font-weight:800;color:#fff}
.cell .dot{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#fff}
.hmleg{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.sw{display:inline-block;width:13px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
a.c{background:var(--card);border:1px solid var(--line);padding:14px 15px 13px;position:relative;
 display:block;text-decoration:none;transition:transform .08s,box-shadow .08s}
a.c:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.07);border-color:#c8c8c4}
.c .rk{font-size:22px;font-weight:800;line-height:1;color:#dedcd7;position:absolute;top:12px;right:13px}
.c.top3 .rk{color:var(--red)}
.c .cm{font-size:10.5px;font-weight:800;color:#fff;background:#3a3a3a;padding:2px 6px;border-radius:2px;display:inline-block}
.c .tt{font-size:14px;font-weight:700;line-height:1.5;margin:8px 34px 8px 0}
.c .dt{font-size:12px;color:#555;line-height:1.55;border-top:1px dashed var(--line);padding-top:8px}
.c .ft{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:2px;white-space:nowrap}
.t-lie{background:var(--redbg);color:var(--red)}.t-num{background:var(--bluebg);color:var(--blue)}
.t-sys{background:var(--goldbg);color:var(--gold)}.t-pol{background:var(--graybg);color:var(--gray)}
.mp{font-size:11.5px;color:var(--sub)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.person{background:var(--card);border:1px solid var(--line);padding:17px 18px}
.person .rank{font-size:30px;font-weight:800;color:var(--red);line-height:1}
.person h3{font-size:18px;font-weight:800;margin:5px 0 1px}
.person .who{font-size:11.5px;color:var(--sub);margin-bottom:9px}
.person p{font-size:13px;line-height:1.65;color:#333}
.person .q{margin-top:9px;padding-left:9px;border-left:2px solid var(--line);font-size:12.5px;color:#444}
.rank-tbl{background:var(--card);border:1px solid var(--line)}
.rr{display:grid;grid-template-columns:40px 1fr 140px 120px 54px;gap:10px;align-items:center;
 padding:9px 15px;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr.hd2{font-size:11px;font-weight:800;color:var(--sub);background:#f6f5f2}
.rr .p1{font-size:15px;font-weight:800;text-align:right;color:var(--sub)}
.rr.g1 .p1{color:var(--red)}
.rr .nm{font-size:14px;font-weight:700}
.rr .nm small{font-weight:400;color:var(--sub);font-size:11.5px;margin-left:5px}
.rr .sc{font-size:14px;font-weight:800;text-align:right}
.mini{display:flex;gap:2px;height:13px}.mini i{display:block;border-radius:1px}
.spark{display:flex;gap:3px;align-items:flex-end;height:18px}
.spark i{display:block;width:9px;background:#c9d4de;border-radius:1px}
.issue{background:var(--card);border:1px solid var(--line);margin-bottom:12px;padding:16px 18px}
.issue h3{font-size:15.5px;font-weight:800;margin-bottom:3px}
.issue .cnt{font-size:12px;color:var(--sub);margin-bottom:10px}
.issue ul{list-style:none}
.issue li{font-size:13.5px;padding:5px 0 5px 14px;position:relative;line-height:1.6}
.issue li:before{content:"·";position:absolute;left:3px;color:var(--sub);font-weight:800}
.issue li a{text-decoration:none}.issue li a:hover{text-decoration:underline}
.cm2{font-size:11px;font-weight:700;color:#fff;background:#444;padding:2px 7px;border-radius:2px;margin-right:6px}
.cross{border-left:3px solid var(--red)}
.cross h3:after{content:" 교차.";color:var(--red);font-size:12px;font-weight:700}
.more{margin-top:12px;text-align:center}
.more button{font:inherit;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);
 padding:9px 20px;cursor:pointer;color:var(--sub)}
.more button:hover{color:var(--ink);border-color:#c8c8c4}
</style>
</head>

<div class="wrap">

  <div class="hm"><table class="heat" id="heat"></table>

건의 CCTV와 유서를 확인하는 현장 검증을 요구했다.","data":"현장 검증 실시 계획서 채택의 건은 재석 의원 17인 중 찬성 5인, 반대 10인, 기권 2인으로 부결됐고, 추가 증인 출석 요구의 건도 재석 의원 16인 중 찬성 5인, 반대 10인, 기권 1인으로 부결됐다. 송석준은 15시간 조사와 같은 질문의 반복이 강압 수사의 반증이라며 서면 동의 없이는 심야 조사를 할 수 없는데 서면 동의가 있었는지 불분명하다고 지적했다. 김용민은 특검이 국민의 명령으로 통과된 법에 따라 시한을 정해 3년 동안 쌓인 비위 16가지를 수사한 것이라고 반박했고, 박은정은 국민의힘의 태도가 민중기 특검 수사를 정쟁화하려는 의도라고 했다.","quote":"18명 중에서 12명은 제외하고 6명만 받으셨는지 도대체 이러한 국회가 있는지 다시 한번 묻고 싶습니다.","qby":"송석준","issues":["국정감사 증인 채택","민중기 특검","현장 검증"],"agencies":[],"ts":"4:44:20","note":""},{"key":"20251013_OAo4XPHu-O4","cm":"법사","date":"2025-10-13","no":0,"rank":0,"t":"대법원장 증인 자격과 선서를 둘러싼 의사진행 파행.","lead":"나경원","co":["곽규택","신동욱","이성윤"],"foe":["추미애","최혁진"],"ty":"pol","claim":"나경원은 대법원장을 증인이 아닌 참고인으로 일방적으로 규정하고 선서 없이 질의를 강행한 것이 삼권분립을 파괴한 폭거라며 추미애 위원장을 비판했고, 곽규택은 오전 국감 진행 자체를 파행적이라고 규정했다.","data":"제시된 수치는 없다. 곽규택은 과거 대법원 국정감사에서는 대법원장이 인사 후 이석하고 기관 증인이 선서한 뒤 질의가 시작됐으나 이번에는 대법원장이 이석하지 않은 채 기관 증인 선서도 하지 않고 진행했다고 지적했다. 추미애 위원장은 곽규택에게 \"두 번 경고합니다. 조용히 해 주세요\"라고 했고 신동욱의 야유에도 대응했으며, 나경원과 야당 의원 사이에 언성이 높아지자 \"싸우지 말고 질의를 하세요\"라며 중재했다. 최혁진은 나경원의 남편을 들어 이해충돌을 지적하며 퇴장을 요구했다. 이성윤은 대법원장이 증인이 아니라 관례적 인사 차원에서 출석한 것이며 참고인 전환에 법사위 의결도 본인 동의도 없었다고 했다.","quote":"삼권 분립이 파괴되는 그러한 폭거를 우리 추미애 위원장님이 저질렀습니다. 지금 삼권 분립은 우리가 지켜야 될 가치입니다.","qby":"나경원","issues":["의사진행 파행","증인 자격","선서"],"agencies":[],"ts":"55:27","note":"'회의장 질서 마찰', '오전 국감 진행을 두고 엇갈린 평가', 나경원·야당 간 언성 대목(TMI), 이성윤의 '관례적 인사' 주장을 하나의 파행 꼭지로 합쳤다."},{"key":"20251013_S3xBOcNgaVI","cm":"산자","date":"2025-10-13","no":38,"rank":1,"t":"대왕고래 층서 트랩 누락 보고와 427% 성과급.","lead":"권향엽","co":[],"foe":[],"ty":"lie","claim":"권향엽은 대왕고래 시추 결과가 축소·왜곡 보고됐다며, 중간 결과에 있던 층서 트랩 미확인 내용이 산업부와 국회에 보고된 최종 자료에서 빠진 것은 명백한 보고 누락이라고 주장했다.","data":"시추 시료 1765개 가운데 코어랩 분석 의뢰는 630개, 실제 분석은 491개로 전체의 27.8%에 그쳤고, 엑트지오 아브레우 박사가 심해 유망 구조 8개 중 7개에 층서 트랩 리스크를 0으로 평가해 유망 구조가 21개로 불어난 뒤 관련자들이 427%의 성과 상여금을 받았다.","quote":"명백한 보고 누락입니다","qby":"권향엽","issues":["대왕고래","동해 심해 가스전","성과급"],"agencies":["한국석유공사","산업통상자원부"],"ts":"8:09:40","note":""},{"key":"20251013_S3 :"외국인 토지거래 허가제는 허가를 먼저 내주고 실거주는 나중에 확인한다.","lead":"김은혜","co":[],"foe":[],"ty":"sys","claim":"김은혜는 외국인 토지거래 허가제가 허가를 먼저 내준 뒤 실거주 여부를 확인하고 자금조달계획서 등 입증 서류 제출 의무도 없어 정작 우리 국민만 규제에 묶여 있다며, 상호주의에 맞게 제도를 시정하라고 요구했다.","data":"제시된 수치는 없다. 김은혜는 중국에서는 외국인이 땅을 살 수 없고 자유로운 주택 취득도 안 되며 주택은 1년에 실거주하는지 반드시 먼저 확인한다는 점을 근거로 들었고, 최근 외국인 투기에서 중국인이 압도적 1위라는 통계를 제시했다. 김윤덕 장관은 현재 구조가 공정하지 않다고 생각한다고 답했고, 자금조달계획서 의무가 없어 규제에 구멍이 뚫렸다는 신호를 준다는 지적에도 \"그럴 수 있다고 생각한다\"고 인정했으며, 외국인이 우대받을 수 있는 법률적 한계가 있다면 반드시 시정하겠다고 답했다.","quote":"우리 국민이 못 누리는 걸 중국인들은 지금 누리고 있습니다.","qby":"김은혜","issues":["외국인 부동산 취득","토지거래허가제","상호주의"],"agencies":["국토교통부"],"ts":"4:45:22","note":""},{"key":"20251013_VFwcSUsIZjg","cm":"국토","date":"2025-10-13","no":19,"rank":10,"t":"지반 침하 867건에도 지하 공동 조치 확인은 절반뿐, 권한 공백이 방치됐다.","lead":"윤종군","co":[],"foe":[],"ty":"num","claim":"윤종군은 지반 침하 관리에 권한 공백이 있다며 지자체가 국토교통부에 조치 사항을 의무 보고하고 중앙정부가 개입할 권한을 신설해야 한다고 요구하고, 위험도 분석이 빠진 지하공간 통합지도를 보완할 종합대책을 국정감사 종료 전까지 보고하라고 요구했다.","data":"윤종군은 최근 5년간 지반 침하가 867건 발생했고 국토안전관리원이 발견한 지하 공동 809건 가운데 지자체 조치가 확인된 곳은 416곳뿐이라고 밝혔다. 국토안전관리원이 지자체를 확인할 권한이 없다고 답해 권한을 부여하는 법안을 발의했더니 국토교통부는 현행 법령으로 실현 가능하다며 부정적 의견을 냈다고 지적했고, 2021년 광주 학동 철거 현장 붕괴 사고(17명 사상) 뒤에야 상주 감리 의무화 등 제도가 강화된 전례를 들었다.","quote":"권한이 없다고 해서 권한을 부여하는 법안을 냈더니 이제 와서 현행법에서 가능하다 하니까 법이 필요 없다, 이게 말이 됩니까?","qby":"윤종군","issues":["지반 침하","싱크홀","지하공간 통합지도"],"agencies":["국토교통부","국토안전관리원"],"ts":"4:35:22","note":""},{"key":"20251013_VFwcSUsIZjg","cm":"국토","date":"2025-10-13","no":24,"rank":11,"t":"자율주행 택시가 3대뿐인 한국은 중국·미국과 비교가 되지 않는다.","lead":"손명수","co":[],"foe":[],"ty":"num","claim":"손명수는 시범 도시를 선정해 도시 전체에서 자율주행이 가능하도록 하고 3년 이내에 상용 서비스를 시작해야 한다며 국토교통부의 준비 부족을 지적했다.","data":"손명수는 한국의 자율주행 택시가 3대뿐이고 강남에서 심야에 차가 없을 때만 운행하며 조수석에 사람이 타는 경우도 있고, 스타트업 하나가 상암에서 3.2km를 혼잡 시간을 피해 운행하는 정도라고 밝혔다. 반면 우한은 서울의 5배 규모 도시 전체에 자율주행을 허가해 1000대 이상이 요금을 받는 상용 서비스를 하고 2000대 이상으로 확대할 방침이며, 베이징 등 20여 개 도시와 두바이까지 진출했고, 웨이모는 1500대로 샌프란시스코에서 주당 25만 건 이상 유료 운행하며 2026년까지 3500대로 늘릴 계획이라고 전했다. 바이두를 방문했을 때 1000대 이상이면 이미 손익분기점을 넘는다는 답을 들었다고도 했다. no":15,"rank":57,"t":"해외직접투자 순유출의 대안으로 관광산업을 키워야 한다.","lead":"김영환","co":[],"foe":[],"ty":"sys","claim":"김영환은 관세 협상 이후 예상되는 해외직접투자 순유출 문제의 대안으로 관광산업 육성을 제시하며, 대규모 공연장만 짓지 말고 스토리텔링과 교통 인프라까지 전체적으로 고민하라고 제안했다.","data":"김영환은 BTS 한 번 공연의 부대효과가 1조 2천억 원 정도라며 관광산업이 GDP의 15.6%를 차지하는 스페인 사례를 들었고, 기획재정부장관은 한류·k문화·k관광을 체계적으로 육성하면 제조업보다 많은 경제 효과가 있다고 보며 내년도 숙박·볼거리·먹을거리를 묶은 관광 산업 육성 대책을 마련하고 있다고 답했다.","quote":"BTS 한 번 공연할 때 부대효과가 1조 2천억 정도","qby":"김영환","issues":["관광산업 육성","해외직접투자"],"agencies":["기획재정부"],"ts":"2:09:37","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":16,"rank":58,"t":"\"국익이 무엇이냐\" — 3500억 달러 분석 자료를 국감 종료 전까지 내라.","lead":"임이자","co":[],"foe":[],"ty":"sys","claim":"임이자는 국익 우선이라면 그 국익이 무엇인지 밝히라며 관련 분석 자료를 국정감사 종료 전까지 제출하라고 지시했다.","data":"제시된 수치는 없다. 임이자는 오전 감사를 정리하며 국민들이 이재명 정부 첫 국정감사에서 어떤 정책을 내고 있는지 궁금해할 것이라며 두루뭉술한 답변보다 무엇을 하고 있다고 속 시원하게 답해 달라고 요구했다.","quote":"3500억 불은 투자할 수 없으니 그냥 하지 말자는 얘기까지 나오는데, 국익 우선이라고 하면 그 국익이 무엇이냐","qby":"임이자","issues":["대미투자 3500억 달러","자료 제출"],"agencies":["기획재정부"],"ts":"2:12:55","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":17,"rank":0,"t":"야당 의원 PPT를 그대로 띄운 반박에 여당이 반발해 파행했다.","lead":"박민규","co":[],"foe":["박대출"],"ty":"pol","claim":"박민규는 오전 최은석이 '이재명 정부 아마추어'라며 제시한 근거 6가지 중 사실이 아닌 부분이 있다며 최은석의 PPT 자료를 그대로 화면에 띄워 반박했다.","data":"박민규는 원전 정책 뒤집기라는 주장에 대해 국정 과제 세부 내용에도 특별히 뒤집은 내용이 없다고 지적했다. 박대출은 야당 의원 질의 자료를 띄워 공격하는 것은 기재위 관행에 맞지 않는다며 항의했고, 임이자는 난감하다며 박민규에게 자료를 내리게 한 뒤 남은 시간 중 5분을 다시 배정해 구두로 입장을 밝히도록 정리했다.","quote":"야당 의원님 질의하신 내용을 이렇게 피피티를 띄워 놓고 이걸로 지금 공격하시고 틀린 엉터리라고 지금 말씀하시는 겁니까. 이건 그동안에 그 기재위에서 해왔던 관행에 맞지 않는다","qby":"박대출","issues":["의사진행 공방","파행"],"agencies":[],"ts":"4:10:20","note":"기사는 문제를 제기한 사람을 박대출로 서술했으나 박민규는 사과 발언에서 '박수영 간사님'을 지목했다. 누가 발언을 중단시켰는지 확인이 필요하다."},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":18,"rank":27,"t":"윤석열 정부 3년 세수결손 100조 원, 2024년 세수의 17.5%가 사라졌다.","lead":"임이자","co":[],"foe":[],"ty":"num","claim":"임이자는 감세와 건전재정이 동시에 가능한 정책인지 물으며 국회 협의 없는 기금 돌려막기 관행을 다시는 반복하지 말아 달라고 당부했다.","data":"임이자는 윤석열 정부 3년간 세수결손 누적액이 100조 원, 실제 세수감소분이 59조 원으로 2024년 세수 전체의 17.5%가 사라졌다고 지적했다. 또 2021년 말 기준 국가부채가 GDP의 48%로 OECD 평균 121.8%에 비해 여력이 있었는데도 윤석열 정부가 위기 극복을 위한 재정 투입을 방만 재정으로 규정해 R&D·복지 예산이 삭감됐다고 주장했고, 기획재정부장관은 정책 효과의 달성 여부를 잘 판단해야 할 것 같다고 답했다.","quote":"위기 상황 극복을 위한 재정 투입이라는 것을 방만 재정이라고 규정해 버리고 구조 조정만을 추진","qby":"임이자","issues":["세수결손","재정건전성"],"agencies":["기획재정부"],"ts":"4:16:15","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":19,"rank":14,"t":"\"불확실성 해소했다\"던 8월 보고, 자동차 관세는 아직 확정도 안 됐다.","lead":"박대출","co":[],"foe":[],"ty":"lie","claim":"박대출은 지난 8월 6일 기획재정부장관이 한미 관세 협상으로 기업들의 불확실성을 해소했다고 보고한 것이 사실인지 따지며 관세 시나리오별 대비가 부실하다고 질타했다.","data":"기획재정부장관은 일부는 해소됐다고 생각한다면서도 자동차 등 일부 분야는 아직 확정이 안 돼서 그런 점은 남아 있다고 인정했다. 박대출은 국회예산정책처에 의뢰한 분석에서 자동차 및 부품 관세율이 50%가 되면 대미 수출이 30% 감소하는 것으로 나왔다고 밝히며, 정부 자체 분석은 월당 7천억 원 정도 수출 감소 수준에 그친다고 지적했다. 장관은 50%·75%는 가정하고 있지 않으며 25%가 더 낮아지도록 집중하겠다고 답했다.","quote":"탁 치니 억 소리가 나서 죽었다는 그 말이 지금 제가 생각이 납니다. …지금 겨우 지금 7천억 감소된다는 그 얘기 이제 겨우 하신 거예요.","qby":"박대출","issues":["한미 관세협상","자동차 관세"],"agencies":["기획재정부"],"ts":"4:20:00","note":"장관의 8월 6일 보고를 인용한 대목에 붙은 타임스탬프가 7:52:11로 표기돼 있어 앞뒤 구간(4:19~4:27)과 맞지 않는다."},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":20,"rank":28,"t":"25개 핵심 지표 재분류 — \"윤석열 정권은 대한민국의 잃어버린 3년\".","lead":"박홍근","co":[],"foe":[],"ty":"num","claim":"박홍근은 윤석열 정부 3년간 경제·민생 지표가 전 분야에서 악화됐다며 '잃어버린 3년'이라고 규정했다.","data":"박홍근은 기재부·한국은행·통계청 지표를 25개 핵심 지표로 재분류한 결과 가계소득, 소비내수, 물가생활비, 고용, 재정투자 5개 분야가 모두 악화됐다고 제시했고, 기획재정부장관은 평상시에 마이너스 성장이 간 것은 심각한 정책 에러가 있었던 것으로 판단된다고 답했다. 박홍근은 6·27 대출규제로 6억 원에 묶인 대출 한도의 추가 하향 여부도 물었으나 장관은 내부 검토 중이라며 즉답을 피했고, 청년층·무주택자·실수요자 부담을 고려하라는 압박에는 정책에 반영하겠다고만 답했다.","quote":"마치 일본의 잃어버린 20년을 얘기하는 것처럼 윤석열 정권은 대한민국의 잃어버린 3년이다.","qby":"박홍근","issues":["경제지표 악화","대출규제"],"agencies":["기획재정부"],"ts":"4:30:56","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":21,"rank":18,"t":"즉시 현금화 가능한 외환은 185억 달러 — 조건부 스와프라도 제안하라.","lead":"박홍근","co":[],"foe":[],"ty":"num","claim":"박홍근은 무제한·상설 스와프가 어렵다면 단계별 또는 제한적 조건을 둔 스와프도 동시에 제안해야 한다며, 제3국과의 양자 스와프와 치앙마이 이니셔티브 등 다변화된 유동성 확보 전략을 주문했다.","data":"박홍근은 9월 말 기준 외환보유액이 4220억 달러이고 이 중 즉시 현금화 가능한 예치금은 4.4%인 185억 달러 수준이며, IMF가 산정한 적정 외환보유액 5000억~5200억 달러에 비해 800억~1000억 달러가 부족하다고 지적했다. 기획재정부장관은 미국의 대규모 현금성 투자 지원 요구에 대해 외환시장을 봐서는 거의 불가능하다고 답했고, 통화 스와프 등 통화 조달은 필요조건이라면서도 상업적 합리성과 국익을 종합해 판단하겠다고 말했다.","quote":"단계별 또는 제한적 조건을 둔 스와프도 동시에 제안할 필요성","qby":"박홍근","issues":["외환보유액","통화스와프"],"agencies":["기획재정부"],"ts":"4:34:20","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":22,"rank":5,"t":"구속 중에도 성과급 50억 — 재벌 총수 보수의 손금 산입을 따졌다.","lead":"차규근","co":[],"foe":[],"ty":"num","claim":"차규근은 실질적으로 직무를 수행하지 않은 임원 보수가 손금으로 산입되는 실무를 바로잡아야 한다며, 근무일수·근무시간, 이사회 등 주요 회의 참석 횟수와 의사결정 기여도, 사업 전문성·기여도로 실질 직무 수행 여부를 판단하도록 한 법인세법 개정안을 올해 세법 심의에서 전향적으로 검토해 달라고 요청했다.","data":"차규근은 조현범(한국앤컴퍼니그룹 회장)이 2개 계열사에서 총 104억 원, 2023년에는 78억 원(이 중 50억 원이 성과급)을 받았는데 2023년 3월부터 11월까지 배임·횡령 혐의로 구속 중이었다고 밝혔다. 신동빈(롯데그룹 회장)은 7개 계열사에서 지난해 216억 원(2023년 212억 원, 2022년 189억 원)으로 롯데지주 직원 평균의 138배를 받았고, 김승연(한화그룹 회장)은 등기 임원인 곳이 하나도 없는데도 4개 계열사에서 139억 원을 받았다고 지적했다. 기획재정부장관은 사실상 실질적으로 직무를 수행해야만 인건비가 비용에 반영된다고 답했고, 구체적 기준의 법률 명시 여부는 국회 세법 심사 과정에서 검토하겠다고 밝혔다.","quote":"구속된 사람이 무슨 일을 했다고 이 보수와 성과급을 수십억씩 받아 간다는 말이에요.","qby":"차규근","issues":["재벌 총수 보수","법인세법 손금산입"],"agencies":["기획재정부"],"ts":"4:38:22","note":"기사는 차규근을 조국혁신당 의원으로 적었으나 2025년 명단에는 무소속으로 올라 있다."},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":23,"rank":29,"t":"총수 일가 지분이 전혀 없는 계열사가 86% — \"코리아 디스카운트의 본질\".","lead":"차규근","co":[],"foe":[],"ty":"num","claim":"차규근은 지분이 없는 지배주주는 배당을 늘릴 이유가 없다며 배당소득세를 낮춰 배당을 늘리려는 정책의 실효성에 의문을 제기했다.","data":"차규근은 신동빈이 롯데케미칼 지분을 하나도 갖고 있지 않으면서도 38억 원의 보수를 받는 등 총수 일가 지분이 전혀 없는 계열사가 전체의 86%에 달한다고 밝혔고, 김승연도 지분이 없는 한화솔루션에서 지난해 적자에도 42억 원을 받았다고 지적했다.","quote":"코리아 디스카운트의 본질","qby":"차규근","issues":["코리아 디스카운트","배당소득세"],"agencies":["기획재정부"],"ts":"4:42:14","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":24,"rank":17,"t":"2065년 국가채무비율 156.3%, 비관 시 170% — 감당할 수 있는 수준인가.","lead":"권영세","co":[],"foe":[],"ty":"num","claim":"권영세는 국가채무비율 상승 속도를 문제 삼으며 신용등급 하락이 조달금리 상승과 환율·주가 불안, 성장률 저하를 거쳐 디폴트 위험까지 갈 수 있다고 경고했다.","data":"권영세는 기재부가 처음 낸 장기 재정전망에서 2065년 국가채무비율이 156.3%까지, 인구·성장을 비관적으로 보면 170%를 넘는다는 점을 확인시켰고, 국가채무비율이 문재인 정부 5년간 11%포인트 올랐는데 이재명 정부 중기 재정운용계획에는 앞으로 4년간 10%포인트가 더 오르도록 계획돼 있다고 지적했다. 국회예산정책처 의뢰 결과 채무비율 60%를 맞추려면 지출만으로는 매년 GDP 대비 2.5%(약 64조 원), 세입만으로는 매년 GDP 대비 4.2%(약 107조 원)가 필요한데 정부 세제개편안은 5년간 35조 원, 연 5조 원 수준이라고 밝혔다. 기획재정부장관은 GDP를 늘려야 한다는 부분에는 진짜 공감한다고 답했다.","quote":"이게 160이나 170이 되면 이게 감당할 수 있는 수준입니까?","qby":"권영세","issues":["국가채무비율","재정건전성","신용등급"],"agencies":["기획재정부"],"ts":"4:46:43","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":25,"rank":11,"t":"R&D 예산 삭감, 법정 기한 이틀 전 뒤집혔다 — 기재부 내부 조사를 요구했다.","lead":"조승래","co":[],"foe":[],"ty":"sys","claim":"조승래는 2024년도 R&D 예산 삭감 과정에서 국가재정법·과학기술기본법 절차가 위반됐다며 기획재정부 내부에서 어떤 일이 벌어졌는지 조사가 필요하고 감사원 감사까지 필요하다고 요구했다.","data":"조승래는 과학기술기본법상 6월 30일까지 과기부 장관이 예산을 편성해 기재부에 통보해야 하는데 그 전날인 6월 28일 윤석열 전 대통령이 국가재정전략회의에서 이를 뒤집었고, 전조로 6월 23일 재정전략회의 발제자가 과기부 장관에서 기획재정부 차관으로 갑자기 바뀌었다고 짚었다. 과기부 진상조사 TF 중간 보고서를 인용해 R&D 예산을 단기간에 10조 규모로 줄이라는 지시가 있었고 기재부 담당 사무관들이 작업에서 빠지고 과장들이 일일이 작업했다는 제보와, 이틀 만에 조정안을 만들라는 지침이 일선 부처에 내려간 사실도 전했다. 기획재정부장관은 기재부가 과기부의 조정안을 하나도 조정하지 않았다고 1차적으로 보고를 들었다고 답했다.","quote":"기재부 내에서도 어떤 일이 벌어졌는지에 대해서도 조사가 필요하다.","qby":"조승래","issues":["R&D 예산 삭감","예산 편성 절차"],"agencies":["기획재정부"],"ts":"4:55:03","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":26,"rank":61,"t":"무제한 통화스와프 제안은 상황을 모면하기 위한 임시 미봉책이다.","lead":"윤영석","co":[],"foe":[],"ty":"pol","claim":"윤영석은 미국의 3500억 달러 투자 요구에서 직접투자 비중이 5% 이하로 후퇴했다며, 무제한 통화스와프 제안은 실현되기 어려운 카드이자 상황을 모면하기 위한 임시 미봉책이라고 몰아붙였다.","data":"윤영석은 애초 이재명 정부의 자화자찬과 달리 직접투자 비중이 5% 이하로 후퇴한 점을 근거로 들었고, 기획재정부장관은 3500억 달러를 한꺼번에 캐시로 내기가 어렵다는 것이 한국의 외환 사정이라고 인정했다.","quote":"상황을 모면하기 위한 임시 미봉책","qby":"윤영석","issues":["대미투자 3500억 달러","통화스와프"],"agencies":["기획재정부"],"ts":"5:00:56","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":27,"rank":30,"t":"재정 준칙은 반드시 도입해야 한다 — 연금 충당 부담을 열거했다.","lead":"윤영석","co":[],"foe":[],"ty":"sys","claim":"윤영석은 국가 채무 비율이 정권 말기 60%에 이를 것이라며 재정 준칙을 반드시 도입하고, 미래 세대로 부담을 떠넘기지 말고 현 세대가 고통을 분담할 대안을 내야 한다고 요구했다.","data":"윤영석은 군인연금이 2065년까지 240조 원 이상, 건강보험 재정이 내년부터 적자로 돌아서 2065년 한 해 230조 원 규모에 이른다는 점과 공무원연금 부담을 열거했다. 기획재정부장관은 재정 규모 증가를 총액이 아니라 컴포넌트로 봐야 한다며 내년도 재정 규모를 8.1% 늘리는 대신 AI 등 특정 분야는 40% 가까이, R&D는 사상 최고 수준으로 늘렸다고 반박하고, 연금·건보 문제는 2차관 주재로 재정 구조 혁신 TF를 만들어 본격적으로 하겠다고 답했다.","quote":"재정 준칙은 제가 보기에는 반드시 도입을 해야 되고요.","qby":"윤영석","issues":["재정준칙","연금 재정"],"agencies":["기획재정부"],"ts":"5:04:41","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":28,"rank":1,"t":"외환보유고에서 동원 가능한 돈은 200억 달러뿐 — 장관이 인정했다.","lead":"임이자","co":[],"foe":[],"ty":"num","claim":"임이자는 외환보유고를 직접투자에 쓰려면 국회 동의가 필요하고 협상 진행 과정을 국회와 소통해야 한다는 점을 못 박으며, 한국에도 이면 합의가 있었는지 확인했다.","data":"임이자는 외환보유고 4100억 달러 중 리스크 없이 동원 가능한 금액이 한국은행 확인 결과 150억 달러에 채권 활용을 더해 200억 달러 수준이라는 점을 확인시켰고, 기획재정부장관은 '맥시멈 연출 가능한 게 한 200억 달러'라며 외환보유액을 쓰지 않고 발생한 이자 등을 가지고 썼을 때라는 조건을 달았다. 이면 합의 여부에는 '저희들은 결코 이면 합의라는 건 있을 수가 없고요'라며 대출·보증·출자를 섞어서 한다는 것이 초지일관 한국의 주장이라고 답했고, 국회 동의와 소통 필요성에는 '맞습니다'라고 답했다.","quote":"이 200억 달러도 실제 지분 출자하게 되면 유동성이 없어지는 거 아니냐","qby":"임이자","issues":["외환보유액","대미투자 3500억 달러","국회 동의"],"agencies":["기획재정부"],"ts":"5:11:19","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":29,"rank":9,"t":"서울 아파트 공급, 2029년엔 연 1천 세대까지 떨어진다.","lead":"이소영","co":[],"foe":[],"ty":"num","claim":"이소영은 서울 아파트 공급이 내년부터 급격히 줄어 절멸 수준에 이른다며, 지금의 절벽은 2022~2025년 사이 착공이 이뤄지지 않은 결과라고 지적했다.","data":"이소영은 서울대 김경민 교수팀의 전수조사를 근거로 서울 아파트 공급이 올해 3만 7천 세대에서 내년 1만 8천 세대로 절반 이하로 떨어지고 2027년 8천 세대, 2028년 5천 세대, 2029년엔 1천 세대까지 급감한다고 제시했다. 빌라를 합친 전체 주택 착공도 2022년 6만 채대에서 오세훈 시장 취임 이후 2만 채대로 3분의 1 토막 났다고 밝혔고, 기획재정부장관은 아파트는 하루아침에 만들어지지 않아 꾸준하게 공급돼야 한다고 동의하면서 정부와 서울시의 협력이 그렇게 원활한 것 같지는 않다고 답했다.","quote":"그러니까 거의 뭐 절벽이 아니라 절멸 수준이라고도 할 수 있을 것 같은데요.","qby":"이소영","issues":["서울 아파트 공급","주택 착공"],"agencies":["기획재정부"],"ts":"5:15:44","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":30,"rank":12,"t":"용산정비창 계획만 일부 바꿔도 아파트 2만 채가 더 나온다.","lead":"이소영","co":[],"foe":[],"ty":"sys","claim":"이소영은 용산정비창 부지를 오피스 중심 개발에서 아파트 위주로 바꿔야 한다며, 용적률 천%를 적용해 3분의 1만 오피스로 남기고 나머지를 주거로 돌리면 25평형 아파트 2만 채를 추가 공급할 수 있다고 제안했다.","data":"이소영은 용산정비창 부지가 15만 평이고 코레일 지분이 70%인데 아파트는 고작 3500세대라고 지적하고, 원래 주거 용도가 98%였던 부지를 오세훈 시장이 상업 지역으로 전환하며 주거 비율을 92%로 줄였고 지난달엔 6천 세대였던 물량을 5300세대로 더 줄였다고 설명했다. 서울 오피스가 연평균 31만 평씩 쏟아져 공실 우려가 큰 점도 짚었고, 기획재정부장관은 관계 부처와 점검해 주택으로 공급 가능하도록 최선의 노력을 다하겠다고 답했다.","quote":"27년부터 서울 아파트 공급이 십수 년 만에 처음으로 1만 채 이하로 떨어지는데, 이 단일 부지에서만 계획을 일부 변경하면 2만 채가 추가로 나오는 것","qby":"이소영","issues":["용산정비창","서울 아파트 공급","국유재산"],"agencies":["기획재정부","코레일"],"ts":"5:20:37","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":31,"rank":31,"t":"문재인 정부 5년 국가채무 400조 증가 — 재정준칙 법제화를 요구했다.","lead":"이인선","co":[],"foe":[],"ty":"num","claim":"이인선은 국가채무 증가 속도를 '재정 폭주'라고 문제 삼으며 재정준칙 법제화를 요구했다.","data":"이인선은 문재인 정부 5년간 국가채무가 400조 원 넘게 늘었고 이재명 정부의 2028년 국가채무 전망이 윤석열 정부 전망보다 152조 원 많다는 그래프를 제시했고, IMF가 재정 지속가능성 확보와 고령화 대응을 위한 장기 재정 개혁을 경고했다는 점과 프랑스에서 확장 재정 이후 신용등급 강등과 긴축 전환 과정에서 대규모 시위가 벌어진 사례를 반면교사로 들었다. 기획재정부장관은 재정의 적극적인 역할을 통해 GDP 분모를 키우는 쪽으로 갈 것인지 많은 고민을 하고 있다고 답했다.","quote":"장기적으로 재정의 지속가능성에 대한 염려는 저도 똑같은 생각을 가지고 있다","qby":"구윤철(기획재정부 장관)","issues":["국가채무","재정준칙"],"agencies":["기획재정부"],"ts":"5:30:17","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":32,"rank":19,"t":"청와대 이전은 국유재산위 심의도 없이 — \"너무 내로남불 아닙니까\".","lead":"천하람","co":[],"foe":[],"ty":"sys","claim":"천하람은 국유재산법에 주요 국가기관 이전 시 심의위원회를 의무화하는 제도 개선을 요구하며, 대통령실이 청와대로 이전하면 용산청사와 한남동 관저를 누가 어떻게 쓸지 물었다.","data":"기획재정부장관은 용산청사에 대해 기본적으로 국방부로 가는 게 맞지 않을까 한다고 답했다가 정부 협의가 아닌 개인적인 생각이라고 인정했고, 한남동 관저 활용 방안에 대해서도 얘기를 해 봐야 할 것 같다는 답만 내놨다. 천하람은 윤석열 정부가 청와대에서 용산으로 옮길 당시에는 국유재산위원회 심의를 거쳤는데 이번 청와대 이전은 심의조차 거치지 않는다고 지적했고, 장관은 제도 개선 요구에 '예 할 겁니다'라고만 답했다.","quote":"지난번에는 관저 옮기는 거 재의결 하나 안 받았다고 어마어마한 위법이다 난리 치다가, 이거는 아예 안 받겠다. 이거 너무 내로남불인 거 아닙니까?","qby":"천하람","issues":["국유재산","대통령실 이전"],"agencies":["기획재정부"],"ts":"5:35:41","note":"기사는 천하람을 개혁신당 의원으로 적었으나 2025년 명단에는 무소속으로 올라 있다."},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":33,"rank":26,"t":"검찰청 폐지 후 예산이 얼마나 드는지 추계조차 없다.","lead":"천하람","co":[],"foe":[],"ty":"sys","claim":"천하람은 검찰청 폐지 후 신설되는 공소청·중대범죄수사청의 예산·인력·청사 계획이 전혀 준비되지 않았다며 추계조차 없는 것이 말이 되느냐고 몰아세웠다.","data":"기획재정부장관은 내년까지 직제가 완전히 확정돼야 알 수 있고 협의가 안 들어와서 대략적으로도 모른다고 답했으며, 공소청이 기존 검찰청 건물을 그대로 쓰는지, 중수청을 공수처처럼 서울에만 두는지에 대해서도 확정된 답을 내놓지 못했다. 장관은 손 놓고 있는 게 아니라 부처가 하고 있으며 승인되면 협의해서 정기국회에 반영하거나 안 되는 것은 예비비를 쓰는 식으로 진행된다고 답했다.","quote":"정부 조직이 무슨 장난도 아니고","qby":"천하람","issues":["정부조직 개편","예산 추계"],"agencies":["기획재정부"],"ts":"5:37:59","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":34,"rank":40,"t":"자산 규모만 보는 차등 규제가 기업의 성장 사다리를 막는다.","lead":"조승래","co":[],"foe":[],"ty":"sys","claim":"조승래는 자산 규모만으로 규제를 차등 적용하는 방식이 낡았다며 자산 규제로 인한 파급효과를 종합적으로 연구해 개선해야 한다고 요구했다.","data":"조승래는 기업이 중소기업에서 중견기업으로, 중견기업에서 대기업으로 성장할 때마다 규제가 기하급수적으로 늘어나는 구조를 '기업판 피터팬 증후군'이라 불렀고, 금융지주회사법의 자기자본 투자 제한이 소프트뱅크 비전펀드 같은 해외 대형 투자사와의 경쟁을 어렵게 만든다고 짚었다. 기획재정부장관은 중소기업 지원이 너무 많아 중견기업으로 갈 이유가 없다며 성장할수록 유리한 인센티브 체계를 만드는 방향으로 이미 내부 작업에 착수했다고 밝혔다.","quote":"기업이 성장할수록 규제가 기하급수적으로 늘어나는 게 지금까지 경제 정책의 운영 방향이었다","qby":"조승래","issues":["기업 규제","중견기업 성장"],"agencies":["기획재정부"],"ts":"5:43:05","note":""},{"key":"20251013_qSQAFvioqTc","cm":"기재","date":"2025-10-13","no":35,"rank":4,"t":"1500억 달러라던 제시액이 3500억 달러로 — 증빙 자료는 내지 못했다.","lead":"박대출","co":[],"foe":[],"ty":"lie","claim":"박대출은 기획재정부장관이 지난 상임위에서 대미 제시 금액을 1500억 달러라고 답했는데 이후 3500억 달러로 늘어난 경위를 밝히고 이를 증빙할 자료를 제출하라고 요구했다.","data":"기획재정부장관은 러트닉 상무장관과 대출·보증·직접투자 세 가지가 섞여서 간다고 얘기하고 협상에 임했다고 설명했지만, 한국 측이 만든 이해 문서와 8월 초 미국이 보낸 MOU 내용이 달랐고 이를 증빙할 자료를 제출하지 못했다. 박대출은 관세 유예 데드라인을 하루 앞두고 협상이 이뤄진 점, 일본·영국 총리는 직접 나섰지만 한국 대통령은 G7과 나토 회담에서 두 차례 트럼프와의 만남 기회를 놓친 점도 짚었고, 한국경제인협회가 대미 투자 대외비 금액을 const TN={lie:'위증·자료거부.',num:'새 수치.',sys:'제도 요구.',pol:'정치 공방.'};
const TC={lie:'#b93a2c',num:'#2b5d8b',sys:'#8a6a1a',pol:'#8a8a8a'};
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const I=DATA.items, RUNS=DATA.runs, SC=DATA.score;
const RUNOF={}; RUNS.forEach(r=>RUNOF[r.cm+'|'+r.date]=r);
const CMFULL={}; DATA.cms.forEach(c=>CMFULL[c[0]]=c[1]);
// 기본 선택일 = 가장 많은 위원회가 열린 날.
let SEL=(()=>{const c={};RUNS.forEach(r=>c[r.date]=(c[r.date]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?1:-1))[0][0];})();

document.getElementById('sum').textContent =
  `회차 ${RUNS.length} · 꼭지 ${I.length} · 등장 의원 ${Object.keys(SC).length}명 · `+
  `위증·자료거부 ${I.filter(x=>x.ty==='lie').length}건.`;

function href(it){return `../assembly/${it.key}/items/${String(it.no).padStart(2,'0')}/`}
function who(it){return [it.lead,...(it.co||[])].filter(Boolean).join(' · ')
  +((it.foe||[]).length?' ↔ '+it.foe.join(' · '):'')}
function card(it,no,showCm){
  return `<a class="c${no<=3?' top3':''}" href="${href(it)}">
   <div class="rk">${no||'—'}</div>
   ${showCm?`<span class="cm">${E(it.cm)}.</span>`:''}
   <div class="tt">${E(it.t)}</div>
   <div class="dt">${E(it.data.length>96?it.data.slice(0,96)+'…':it.data)}</div>
   <div class="ft"><span class="tag t-${it.ty}">${TN[it.ty]}</span>
    <span class="mp">${E(who(it))}.</span></div></a>`;
}

/* 히트맵 */
(function(){
  const map={};I.forEach(it=>{const k=it.cm+'|'+it.date;
    (map[k]=map[k]||{n:0,lie:0});map[k].n++;if(it.ty==='lie')map[k].lie++;});
  const ds=DATA.dates;
  let h='<tr><th></th>'+ds.map(d=>`<th>${d.slice(5).replace('-','.')}</th>`).join('')+'</tr>';
  DATA.cms.forEach(c=>{
    h+=`<tr><th class="cm">${c[0]}</th>`;
    ds.forEach(d=>{
      const v=map[c[0]+'|'+d];
      if(!v){h+='<td><div class="cell"></div></td>';return}
      const r=v.lie/Math.max(v.n,1);
      const bg=r>.15?'#b93a2c':r>.05?'#a15a48':'#7d9ab5';
      h+=`<td><div class="cell has${d===SEL?' sel':''}" style="background:${bg}"
        data-cm="${c[0]}" data-d="${d}" title="${c[1]} ${d} · 꼭지 ${v.n}건 · 위증 ${v.lie}건">
        <span class="n">${v.n}</span>${v.lie?'<span class="dot"></span>':''}</div></td>`;
    });
    h+='</tr>';
  });
  document.getElementById('heat').innerHTML=h;
})();

/* 오늘 — 선택한 날짜 기준 */
function drawDay(){
  document.querySelectorAll('.cell.has').forEach(c=>
    c.classList.toggle('sel',c.dataset.d===SEL));
  const day=I.filter(x=>x.date===SEL);
  const cms=[...new Set(day.map(x=>x.cm))];
  document.getElementById('dayttl').innerHTML=
    `${SEL.slice(5).replace('-','월 ')}일 국감 스타 톱 3.<small>위원회 ${cms.length} · 꼭지 ${day.length}건.</small>`;
  // 스타 — 그날 점수 상위 3
  const s=Object.entries(SC).map(([n,v])=>[n,v.by_date[SEL]||0,v])
    .filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  document.getElementById('people').innerHTML=s.map(([n,p,v],i)=>{
    const best=day.filter(x=>x.lead===n).sort((a,b)=>(a.rank||99)-(b.rank||99))[0];
    return `<div class="person"><div class="rank">${i+1}</div><h3>${E(n)}.</h3>
      <div class="who">${E(v.cms.join(' · '))} · 그날 ${p}점 · 꼭지 ${day.filter(x=>
        x.lead===n||(x.co||[]).includes(n)||(x.foe||[]).includes(n)).length}건.</div>
      ${best?`<p>${E(best.claim)}</p><div class="q">"${E(best.quote)}" — ${E(best.qby)}.</div>`:''}
      </div>`;}).join('') || '<div class="mp">그날 점수를 받은 의원이 없다.</div>';
  // 톱 12 — 위원회별 순위를 섞어 앞에서부터
  const top=day.filter(x=>x.rank>=1).sort((a,b)=>a.rank-b.rank||(a.cm<b.cm?-1:1)).slice(0,12);
  document.getElementById('topCards').innerHTML=top.map((x,i)=>card(x,i+1,true)).join('');
}
drawDay();

/* 이슈축 */
(function(){
  const g={};I.forEach(it=>(it.issues||[]).forEach(t=>(g[t]=g[t]||[]).push(it)));
  const list=Object.entries(g).filter(([,v])=>v.length>1)
    .sort((a,b)=>{const ca=new Set(a[1].map(x=>x.cm)).size,cb=new Set(b[1].map(x=>x.cm)).size;
      return cb-ca||b[1].length-a[1].length;});
  document.getElementById('issues').innerHTML=list.map(([n,v])=>{
    const cs=[...new Set(v.map(x=>x.cm))];
    return `<div class="issue ${cs.length>1?'cross':''}"><h3>${E(n)}</h3>
     <div class="cnt">${v.length}건 · ${cs.join(' · ')}.</div>
     <ul>${v.sort((a,b)=>(a.rank||99)-(b.rank||99)).map(x=>
       `<li><span class="cm2">${E(x.cm)}</span><a href="${href(x)}">${E(x.t)}</a>
        <span class="mp">— ${E(who(x))}.</span></li>`).join('')}</ul></div>`;
  }).join('') || '<div class="mp">둘 이상 묶인 태그가 없다.</div>';
})();

/* 의원 순위 */
let rankN=30;
function drawRank(){
  const ds=DATA.dates;
  const all=Object.entries(SC).filter(([,v])=>v.tot>0).sort((a,b)=>b[1].tot-a[1].tot);
  const rows=all.slice(0,rankN).map(([n,s],i)=>{
    const bars=['lie','num','sys','pol'].map(t=>s.ty[t]
      ?`<i style="width:${Math.min(s.ty[t]*7,60)}px;background:${TC[t]}"></i>`:'').join('');
    const mx=Math.max(...ds.map(d=>s.by_date[d]||0),1);
    const sp=ds.map(d=>`<i style="height:${Math.round((s.by_date[d]||0)/mx*18)||1}px"
      title="${d} ${s.by_date[d]||0}점"></i>`).join('');
    return `<div class="rr${i<3?' g1':''}"><div class="p1">${i+1}</div>
      <div class="nm">${E(n)}.<small>${E(s.cms.join('·'))} · 꼭지 ${s.n}건</small></div>
      <div class="mini">${bars}</div><div class="spark">${sp}</div>
      <div class="sc">${s.tot}</div></div>`;}).join('');
  document.getElementById('rankAll').innerHTML=
    `<div class="rr hd2"><div>순위.</div><div>의원.</div><div>질의 성향.</div>
     <div>날짜별.</div><div style="text-align:right">점수.</div></div>`+rows;
  document.getElementById('moreRank').style.display=rankN>=all.length?'none':'';
  document.getElementById('moreRank').textContent=`더 보기 (${all.length-rankN}명 남음).`;
}
drawRank();
document.getElementById('moreRank').onclick=()=>{rankN+=40;drawRank()};

/* 위원회별 */
document.getElementById('cmPanels').innerHTML=RUNS.map(r=>{
  const list=I.filter(x=>x.key===r.key).sort((a,b)=>(a.rank||99)-(b.rank||99));
  return `<h2 id="cm-${r.key}">${E(r.cmfull)}.<small>${r.date} · 위원장 ${E(r.chair)} · 꼭지 ${list.length}건</small></h2>
    <div class="grid">${list.map(x=>card(x,x.rank,false)).join('')}</div>`;
}).join('');

/* 유형축 */
document.getElementById('typePanels').innerHTML=['lie','num','sys','pol'].map(t=>{
  const list=I.filter(x=>x.ty===t).sort((a,b)=>(a.rank||99)-(b.rank||99));
  const cs=[...new Set(list.map(x=>x.cm))];
  return `<h2>${TN[t]}<small>${list.length}건 · ${cs.join(' · ')}</small></h2>
    <div class="grid">${list.slice(0,60).map(x=>card(x,x.rank,true)).join('')}</div>
    ${list.length>60?`<div class="more mp">외 ${list.length-60}건.</div>`:''}`;
}).join('');

/* 상호작용 */
document.addEventListener('click',e=>{
  const c=e.target.closest('.cell.has');
  if(c){SEL=c.dataset.d;drawDay();
    document.getElementById('dayttl').scrollIntoView({behavior:'smooth',block:'start'});}
});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById('p-'+b.dataset.p).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});});
</script>
